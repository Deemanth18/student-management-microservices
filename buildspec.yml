
version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: ap-southeast-2
    AWS_ACCOUNT_ID: "382525920826"

phases:
  pre_build:
    commands:
      - echo "Logging in to Amazon ECR"
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com

  build:
    commands:
      # Build Student Service
      - echo "Building Student Service Docker image"
      - docker build -t student-service:latest ./student-service
      - docker tag student-service:latest $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/student-service:latest
      - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/student-service:latest

      # Build Course Service
      - echo "Building Course Service Docker image"
      - docker build -t course-service:latest ./course-service
      - docker tag course-service:latest $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/course-service:latest
      - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/course-service:latest

  post_build:
    commands:
      - echo "Preparing Student deployment artifacts"
      - mkdir -p output/student
      - cp deployment/student-appspec.yaml output/student/appspec.yaml
      - cp deployment/student-taskdef.json output/student/taskdef.json
      - printf '{"ImageURI":"%s"}' "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/student-service:latest" > output/student/imageDetail.json

      - echo "Preparing Course deployment artifacts"
      - mkdir -p output/course
      - cp deployment/course-appspec.yaml output/course/appspec.yaml
      - cp deployment/course-taskdef.json output/course/taskdef.json
      - printf '{"ImageURI":"%s"}' "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/course-service:latest" > output/course/imageDetail.json

      - echo "Both microservices built and pushed successfully"

artifacts:
  files:
    - output/student/**/*
    - output/course/**/*
  discard-paths: no
